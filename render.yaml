databases:
  - name: pawevents-db
    plan: free
    databaseName: pawevents
    user: pawevents

services:
  # Spring Boot API
  - type: web
    name: pawevents-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/published-events
    envVars:
      - key: DB_HOST
        fromDatabase: { name: pawevents-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: pawevents-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: pawevents-db, property: database }
      - key: DB_USER
        fromDatabase: { name: pawevents-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: pawevents-db, property: password }
      - key: KEYCLOAK_ISSUER_URI
        value: https://pawevents-auth.onrender.com/realms/event-ticket-platform
      - key: SHOW_SQL
        value: "false"

  # Keycloak (stores its data in the same Postgres, under the "keycloak" schema)
  - type: web
    name: pawevents-auth
    runtime: docker
    plan: free
    rootDir: backend/keycloak
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: "8080"
      - key: KC_HOSTNAME
        value: https://pawevents-auth.onrender.com
      - key: KC_PROXY_HEADERS
        value: xforwarded
      - key: KC_HTTP_ENABLED
        value: "true"
      - key: KC_DB
        value: postgres
      - key: KC_DB_SCHEMA
        value: keycloak
      - key: KC_DB_URL_HOST
        fromDatabase: { name: pawevents-db, property: host }
      - key: KC_DB_URL_PORT
        fromDatabase: { name: pawevents-db, property: port }
      - key: KC_DB_URL_DATABASE
        fromDatabase: { name: pawevents-db, property: database }
      - key: KC_DB_USERNAME
        fromDatabase: { name: pawevents-db, property: user }
      - key: KC_DB_PASSWORD
        fromDatabase: { name: pawevents-db, property: password }
      - key: KC_BOOTSTRAP_ADMIN_USERNAME
        value: admin
      - key: KC_BOOTSTRAP_ADMIN_PASSWORD
        generateValue: true
      - key: JAVA_OPTS_KC_HEAP
        value: -XX:MaxRAMPercentage=65 -XX:InitialRAMPercentage=25
